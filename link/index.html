<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speak with our team — Reload.</title>
<meta name="description" content="Tell us what you need. We get back within 24 hours.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060606;
  --bg2:#0b0b0b;
  --surface:#101010;
  --surface2:#161616;
  --surface3:#1c1c1c;
  --accent:#c9a227;
  --accent-light:#e2bf4f;
  --accent-dark:#a88520;
  --accent-glow:rgba(201,162,39,.12);
  --accent-glow2:rgba(201,162,39,.06);
  --white:#fafafa;
  --text:#d4d4d4;
  --text2:#8a8a8a;
  --text3:#5a5a5a;
  --border:rgba(255,255,255,.07);
  --border2:rgba(255,255,255,.04);
  --danger:#e85a4f;
  --success:#3ddc97;
}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
h1,h2,h3{font-family:'Outfit','Inter',sans-serif;font-weight:700;line-height:1.1;color:var(--white)}
a{color:var(--accent-light);text-decoration:none}
::selection{background:var(--accent);color:#000}

.bg-fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-fx .glow{position:absolute;border-radius:50%;filter:blur(140px)}
.bg-fx .g1{width:700px;height:700px;background:rgba(201,162,39,.05);top:-15%;left:50%;transform:translateX(-50%)}
.bg-fx .g2{width:350px;height:350px;background:rgba(201,162,39,.04);bottom:5%;right:-5%}
.bg-fx .lines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:100px 100px;mask-image:radial-gradient(ellipse 55% 55% at 50% 45%,black 10%,transparent 80%)}

.topbar{position:relative;z-index:2;padding:1.5rem 2rem;display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;width:100%}
.brand{display:flex;align-items:center;gap:.55rem;font-family:'Outfit',sans-serif;font-weight:700;font-size:1.4rem;color:var(--white);letter-spacing:-.02em}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.topbar-link{font-size:.82rem;color:var(--text2);transition:color .3s}
.topbar-link:hover{color:var(--white)}

/* /link variant: form is the page — center vertically too, no video frame */
.main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem 5rem;width:100%;max-width:680px;margin:0 auto}

.card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:2.4rem 2.2rem;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.tag{display:inline-flex;align-items:center;gap:.5rem;font-size:.68rem;text-transform:uppercase;letter-spacing:.25em;color:var(--accent);font-weight:600;margin-bottom:1rem}
.tag::before{content:'';width:18px;height:1px;background:var(--accent)}
.card h1{font-size:clamp(1.8rem,3.6vw,2.4rem);letter-spacing:-.03em;margin-bottom:.75rem}
.card .lede{color:var(--text2);font-size:.95rem;line-height:1.7;margin-bottom:2rem;max-width:520px}

form{display:flex;flex-direction:column;gap:1.1rem;margin-top:.5rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
@media (max-width:520px){.row{grid-template-columns:1fr}}
.field label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--text2);font-weight:600;margin-bottom:.45rem}
.field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem;font-family:'Inter',sans-serif;font-size:.95rem;color:var(--white);transition:border-color .2s,background .2s;resize:vertical}
.field textarea{min-height:88px;line-height:1.55}
.field input:focus,.field textarea:focus{outline:none;border-color:rgba(201,162,39,.4);background:var(--bg)}
.field input::placeholder,.field textarea::placeholder{color:var(--text3)}
.submit{margin-top:.8rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:1rem 1.4rem;border-radius:100px;font-weight:600;font-size:.95rem;border:none;cursor:pointer;background:var(--white);color:#000;transition:all .35s cubic-bezier(.16,1,.3,1)}
.submit:hover:not(:disabled){background:var(--accent);transform:translateY(-2px);box-shadow:0 16px 50px rgba(201,162,39,.25)}
.submit:disabled{opacity:.55;cursor:not-allowed}

.err{margin-top:.4rem;background:rgba(232,90,79,.08);border:1px solid rgba(232,90,79,.3);color:#ffb4ad;font-size:.85rem;padding:.7rem .9rem;border-radius:10px}
.legal{margin-top:1rem;font-size:.72rem;color:var(--text3);line-height:1.6;text-align:center}

.success{text-align:center;padding:1rem .5rem}
.success .check{width:64px;height:64px;border-radius:50%;background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.3);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto 1.4rem;font-size:2rem;font-weight:700}
.success h2{font-size:1.6rem;margin-bottom:.6rem;letter-spacing:-.02em}
.success p{color:var(--text2);font-size:.95rem;line-height:1.7;max-width:380px;margin:0 auto}
</style>

<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2078308929790233');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=2078308929790233&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel Code -->

</head>
<body>
<div class="bg-fx" aria-hidden="true">
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  <div class="lines"></div>
</div>

<header class="topbar">
  <a href="/" class="brand"><span class="dot"></span>Reload<span style="color:var(--accent)">.</span></a>
  <a href="/" class="topbar-link">&larr; Back to home</a>
</header>

<main class="main">
  <section class="card" id="card">
    <span class="tag">Speak with our team</span>
    <h1>Tell us what you need.</h1>
    <p class="lede">Drop the basics and three quick answers. We get back to you on WhatsApp within 24 hours with a tailored plan.</p>

    <form id="lead-form" novalidate>
      <div class="row">
        <div class="field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" required autocomplete="given-name" placeholder="John">
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" required autocomplete="family-name" placeholder="Smith">
        </div>
      </div>

      <div class="field">
        <label for="whatsapp">WhatsApp number</label>
        <input id="whatsapp" name="whatsapp" type="tel" required autocomplete="tel" placeholder="+1 555 123 4567">
      </div>

      <div class="field">
        <label for="q1">What do you need?</label>
        <textarea id="q1" name="q1" required placeholder="E.g. a US LLC with a business bank account so I can run Stripe."></textarea>
      </div>

      <div class="field">
        <label for="q2">How much revenue are you doing per month?</label>
        <textarea id="q2" name="q2" required placeholder="E.g. $25k/mo, growing 15% MoM."></textarea>
      </div>

      <div class="field">
        <label for="q3">What advertising platforms are you using?</label>
        <textarea id="q3" name="q3" required placeholder="E.g. Meta, Google Ads, TikTok."></textarea>
      </div>

      <button type="submit" class="submit" id="submit-btn">
        Send my details &rarr;
      </button>

      <div id="error" class="err" hidden></div>
      <p class="legal">By submitting you agree to be contacted by our team. We never sell or share your details.</p>
    </form>
  </section>
</main>

<script>
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycby69DmKM0F_5TR4dmTdovtwbjAZQmjGsKuGgY4spp4VodxdGHegnuxiIzHOlcYHHIDYnQ/exec";

const form = document.getElementById("lead-form");
const card = document.getElementById("card");
const btn  = document.getElementById("submit-btn");
const errEl = document.getElementById("error");

function showError(msg) {
  errEl.textContent = msg;
  errEl.hidden = false;
}
function clearError() {
  errEl.hidden = true;
  errEl.textContent = "";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearError();

  const data = {
    firstName: form.firstName.value.trim(),
    lastName: form.lastName.value.trim(),
    whatsapp: form.whatsapp.value.trim(),
    q1: form.q1.value.trim(),
    q2: form.q2.value.trim(),
    q3: form.q3.value.trim(),
    source: "link",
    submittedAt: new Date().toISOString(),
  };

  if (!data.firstName || !data.lastName || !data.whatsapp || !data.q1 || !data.q2 || !data.q3) {
    showError("Please fill in every field before submitting.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending…";

  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data),
    });
  } catch (err) {
    console.warn("webhook POST error (continuing — Apps Script may still have received it):", err);
  }

  // Meta Pixel — CompleteRegistration event for this lead.
  try {
    const eventId = (crypto.randomUUID && crypto.randomUUID()) ||
                    (Date.now() + "-" + Math.random().toString(36).slice(2));
    if (window.fbq) {
      fbq("track", "CompleteRegistration", {
        content_name: "Reload Formations Lead — /link",
        status: true,
        value: 100,
        currency: "USD",
      }, { eventID: eventId });
    }
  } catch (err) {
    console.warn("fbq CompleteRegistration error (non-fatal):", err);
  }

  card.innerHTML = `
    <div class="success">
      <div class="check">&#10003;</div>
      <h2>Got it — thanks ${data.firstName}.</h2>
      <p>We'll reach out on WhatsApp within 24 hours with a plan tailored to your answers.</p>
    </div>
  `;
  card.scrollIntoView({ behavior: "smooth", block: "center" });
});
</script>
</body>
</html>
